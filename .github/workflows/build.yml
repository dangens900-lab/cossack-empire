
name: Cossack Imperia Build

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Minecraft Mod
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Find Gradle project
        id: project
        shell: bash
        run: |
          if [ -f build.gradle ] || [ -f build.gradle.kts ]; then
            echo "dir=." >> "$GITHUB_OUTPUT"
          else
            FILE=$(find . -type f \( -name build.gradle -o -name build.gradle.kts \) -not -path '*/build/*' | head -n 1)
            if [ -z "$FILE" ]; then
              echo "ERROR: build.gradle was not found."
              echo "Upload the complete Minecraft project to GitHub."
              exit 1
            fi
            echo "dir=$(dirname "$FILE")" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build mod
        working-directory: ${{ steps.project.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew --no-daemon build
          else
            gradle --no-daemon build
          fi

      - name: Upload mod JAR
        uses: actions/upload-artifact@v4
        with:
          name: cossack-imperia-mod
          path: '**/build/libs/*.jar'
          if-no-files-found: error
          retention-days: 14
          
